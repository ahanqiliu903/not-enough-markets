name: Desk

on:
  push:
    branches: [main]
    paths:
      - "apps/desk/**"
      - "contract/**"
      - ".github/workflows/desk.yml"
  pull_request:
    paths:
      - "apps/desk/**"
      - "contract/**"
      - ".github/workflows/desk.yml"

permissions:
  contents: read

jobs:
  desk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desk/package-lock.json
      - run: npm ci
      # Electron downloads its binary on first use; fetch it up front so failures are clear.
      - run: node node_modules/electron/install.js
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Ubuntu 24.04 blocks unprivileged user namespaces, which Chromium's sandbox needs.
      # Re-allow them instead of running Electron with --no-sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run --auto-servernum npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desk-playwright-report
          path: |
            apps/desk/playwright-report
            apps/desk/test-results
          retention-days: 7
