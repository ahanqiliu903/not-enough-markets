# DESK-018 packaging. Releases are unsigned (no paid Apple account, no Windows certificate),
# so builds need no secrets: macOS gets only an ad-hoc signature ("-", no Developer ID, no
# notarization) and Windows none. Users see a first-open warning; see README "Install".
# No auto-update: DESK-019 only links to a newer GitHub release, so no update metadata is made.
appId: dev.notenoughmarkets.desk
productName: NEM Desk
# No spaces: GitHub Releases would rename the assets.
artifactName: NEM-Desk-${version}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
# "Sample data" source (DESK-004): a copy of the contract's basic fixture, without nem.db.
# Main reads it from <resources>/sample in a packaged build.
extraResources:
  - from: ../../contract/fixtures/basic/out
    to: sample/out
  - from: ../../contract/fixtures/basic/summary.json
    to: sample/summary.json
  - from: ../../contract/fixtures/basic/status.json
    to: sample/status.json
mac:
  target:
    # One dmg per architecture: about half the size of a universal build each.
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.finance
  # Ad-hoc signature only. Apple Silicon refuses to run a downloaded app whose bundle has no
  # valid signature at all ("is damaged"); ad-hoc gets the normal "Open Anyway" path instead.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
dmg:
  writeUpdateInfo: false
win:
  target:
    - target: nsis
      arch: [x64]
  # No certificate: electron-builder skips Authenticode signing; SmartScreen warns once.
  forceCodeSigning: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false
linux:
  target:
    - AppImage
  category: Finance
publish: null
